<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña — Excursiones Delgado</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #0a6b73 0%, #02535a 45%, #013840 100%);
    }

    /* Misma decoración de fondo que login.html, para que se sienta parte
       del mismo sistema en vez de una página aparte y genérica. */
    svg.decoracion {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.45;
      pointer-events: none;
    }
    .mapa-fondo {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.6;
      pointer-events: none;
    }

    .caja {
      position: relative;
      z-index: 2;
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      animation: aparecer 0.35s ease;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icono-cabecera {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 30px;
      background: #eef6f6;
    }
    .icono-cabecera.exito { background: #e0f5e0; }
    .icono-cabecera.error { background: #fbe2e0; }

    h1 {
      color: #02535a;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 6px;
      text-align: center;
    }
    p.subtitulo {
      color: #666;
      font-size: 0.92rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .input-group {
      position: relative;
      margin-bottom: 14px;
    }
    input {
      width: 100%;
      padding: 13px 42px 13px 14px;
      border: 1.5px solid #dde8e8;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #02535a;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
      font-size: 18px;
      user-select: none;
    }
    .toggle-password:hover { color: #02535a; }

    .requisito {
      font-size: 0.78rem;
      color: #999;
      margin: -6px 0 16px 4px;
    }

    button {
      width: 100%;
      background-color: #02535a;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    button:hover:not(:disabled) { background-color: #037177; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background-color: #a9c3c4; cursor: default; }

    .mensaje-error {
      text-align: center;
      color: #444;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .mensaje-exito {
      text-align: center;
      color: #444;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    a.volver-login {
      display: block;
      text-align: center;
      margin-top: 6px;
      background-color: #02535a;
      color: white;
      text-decoration: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
    }
    a.volver-login:hover { background-color: #037177; }

    #pantallaCargando { text-align: center; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 6px auto 16px;
      border: 3px solid #dde8e8;
      border-top-color: #02535a;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    #pantallaCargando p {
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="mapa-fondo"></div>
  <svg class="decoracion" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <path d="M 80 650 C 250 600, 350 500, 300 400" stroke="white" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.5"/>
    <circle cx="300" cy="400" r="7" fill="white" opacity="0.7"/>
    <path d="M 950 120 C 1050 180, 1120 260, 1080 340" stroke="white" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.5"/>
    <circle cx="1080" cy="340" r="7" fill="white" opacity="0.7"/>
    <g transform="translate(140,90) rotate(-20)" opacity="0.5">
      <path d="M0 10 L36 0 L40 6 L14 14 L20 24 L10 22 L0 10 Z" fill="white"/>
    </g>
    <g transform="translate(980 620) rotate(140)" opacity="0.4">
      <path d="M0 10 L36 0 L40 6 L14 14 L20 24 L10 22 L0 10 Z" fill="white"/>
    </g>
  </svg>

  <div class="caja">

    <div id="pantallaCargando">
      <div class="icono-cabecera">🔑</div>
      <h1>Verificando el enlace</h1>
      <div class="spinner"></div>
      <p>Un momento, por favor...</p>
    </div>

    <div id="pantallaError" style="display:none;">
      <div class="icono-cabecera error">⚠️</div>
      <h1>No pudimos procesar el enlace</h1>
      <p class="mensaje-error" id="textoError"></p>
      <a href="https://excursionesdelgado.com" class="volver-login">← Volver al inicio de sesión</a>
    </div>

    <div id="pantallaFormulario" style="display:none;">
      <div class="icono-cabecera">🔑</div>
      <h1>Elegí tu nueva contraseña</h1>
      <p class="subtitulo" id="correoDeCuenta"></p>
      <form id="formNuevaContrasena">
        <div class="input-group">
          <input type="password" id="nuevaContrasena" placeholder="Nueva contraseña" required minlength="6">
          <span class="toggle-password" onclick="togglePassword('nuevaContrasena', this)">👁️</span>
        </div>
        <div class="requisito">Mínimo 6 caracteres</div>
        <div class="input-group">
          <input type="password" id="confirmarContrasena" placeholder="Confirmar nueva contraseña" required minlength="6">
          <span class="toggle-password" onclick="togglePassword('confirmarContrasena', this)">👁️</span>
        </div>
        <button type="submit" id="btnCambiar" style="margin-top:8px;">Cambiar contraseña</button>
      </form>
    </div>

    <div id="pantallaExito" style="display:none;">
      <div class="icono-cabecera exito">✅</div>
      <h1>¡Listo!</h1>
      <p class="mensaje-exito">Tu contraseña se cambió correctamente. Ya podés iniciar sesión con la nueva.</p>
      <a href="https://excursionesdelgado.com" class="volver-login">Ir a iniciar sesión →</a>
    </div>

  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDUEZgkrW-3HbZu2BLej4v0mbDHZf2vRo8",
    authDomain: "tours-460717.firebaseapp.com",
    projectId: "tours-460717",
    storageBucket: "tours-460717.firebasestorage.app",
    messagingSenderId: "1000749333444",
    appId: "1:1000749333444:web:73437891b59a96b6a4c291"
  };
  firebase.initializeApp(firebaseConfig);

  function mostrarPantalla(id) {
    ["pantallaCargando", "pantallaError", "pantallaFormulario", "pantallaExito"].forEach(p => {
      document.getElementById(p).style.display = (p === id) ? "block" : "none";
    });
  }

  // NUEVO: mostrar/ocultar contraseña en cualquiera de los dos campos,
  // igual que ya existe en login.html.
  function togglePassword(idCampo, icono) {
    const campo = document.getElementById(idCampo);
    if (campo.type === "password") {
      campo.type = "text";
      icono.textContent = "🙈";
    } else {
      campo.type = "password";
      icono.textContent = "👁️";
    }
  }

  function mensajeDeError(codigo) {
    switch (codigo) {
      case "auth/expired-action-code":
        return "Este enlace ya venció. Pedí uno nuevo desde la pantalla de inicio de sesión (\"¿Olvidaste tu contraseña?\").";
      case "auth/invalid-action-code":
        return "Este enlace ya no es válido — puede que ya se haya usado, o que haya pasado demasiado tiempo. Pedí uno nuevo desde el inicio de sesión.";
      case "auth/user-disabled":
        return "Esta cuenta está deshabilitada. Contactá a un administrador.";
      case "auth/user-not-found":
        return "No se encontró la cuenta asociada a este enlace.";
      case "auth/weak-password":
        return "La contraseña es muy corta o muy simple. Usá al menos 6 caracteres.";
      default:
        return "No se pudo procesar el enlace. Pedí uno nuevo desde el inicio de sesión.";
    }
  }

  const parametros = new URLSearchParams(window.location.search);
  const modo = parametros.get("mode");
  const oobCode = parametros.get("oobCode");

  // NUEVO: esta verificación es de solo lectura — confirma que el enlace es
  // válido y de qué correo es, pero NO lo consume. El enlace solo se gasta
  // de verdad al llamar confirmPasswordReset más abajo, que pasa únicamente
  // cuando la persona le da clic al botón "Cambiar contraseña" — así un
  // escaneo automático del correo (que solo abre la página, no le da clic
  // a nada) ya no puede arruinar el enlace antes de que la persona real lo
  // use.
  if (modo !== "resetPassword" || !oobCode) {
    mostrarPantalla("pantallaError");
    document.getElementById("textoError").textContent = "Este enlace no es válido. Pedí uno nuevo desde el inicio de sesión.";
  } else {
    firebase.auth().verifyPasswordResetCode(oobCode).then(correo => {
      document.getElementById("correoDeCuenta").textContent = `Cuenta: ${correo}`;
      mostrarPantalla("pantallaFormulario");
    }).catch(error => {
      console.error("Error al verificar el enlace de reset:", error);
      mostrarPantalla("pantallaError");
      document.getElementById("textoError").textContent = mensajeDeError(error.code);
    });
  }

  document.getElementById("formNuevaContrasena").addEventListener("submit", async function (e) {
    e.preventDefault();
    const nueva = document.getElementById("nuevaContrasena").value;
    const confirmar = document.getElementById("confirmarContrasena").value;

    if (nueva !== confirmar) {
      alert("Las dos contraseñas no coinciden. Revisalas e intentá de nuevo.");
      return;
    }
    if (nueva.length < 6) {
      alert("La contraseña debe tener al menos 6 caracteres.");
      return;
    }

    const boton = document.getElementById("btnCambiar");
    boton.disabled = true;
    boton.textContent = "Cambiando...";

    try {
      // NUEVO: acá es donde el enlace realmente se consume — solo pasa por
      // el clic explícito de la persona, nunca por una carga automática de
      // la página.
      await firebase.auth().confirmPasswordReset(oobCode, nueva);
      mostrarPantalla("pantallaExito");
    } catch (error) {
      console.error("Error al confirmar el reset de contraseña:", error);
      mostrarPantalla("pantallaError");
      document.getElementById("textoError").textContent = mensajeDeError(error.code);
    }
  });
</script>
</body>
</html>
