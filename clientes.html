<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Excursiones Delgado</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="topbar.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f7f7;
      margin: 0;
      padding: 0;
      color: #02535a;
    }
    h2 {
      margin-bottom: 4px;
    }
    .subtitulo {
      color: #5f9296;
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .tabla-container {
      max-width: 100%;
      overflow-x: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 14px rgba(2,83,90,0.08);
    }

    .acciones-superiores {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-agregar {
      font-size: 15px;
      padding: 10px 20px;
      border-radius: 8px;
      background-color: #02535a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-agregar:hover { background-color: #036a6d; }

    input[type="search"] {
      flex: 1;
      min-width: 240px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #cfe3e4;
      box-sizing: border-box;
      font-size: 14px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: separate;
      border-spacing: 0;
    }
    th {
      background-color: #02535a;
      color: white;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 14px 16px;
      text-align: left;
    }
    th:first-child { border-top-left-radius: 10px; }
    th:last-child { border-top-right-radius: 10px; text-align: center; }
    td {
      padding: 14px 16px;
      font-size: 14.5px;
      vertical-align: middle;
      border-bottom: 1px solid #eef3f3;
    }
    tbody tr:hover { background-color: #f7fbfb; }
    tbody tr:last-child td { border-bottom: none; }

    .celda-nombre { font-weight: bold; color: #02535a; }
    .celda-contacto small { display: block; color: #5f9296; font-size: 12.5px; }

    .pastilla-pasaporte {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: bold;
    }
    .pastilla-pasaporte.ok { background: #e0f5e0; color: #1b6e1b; }
    .pastilla-pasaporte.pronto { background: #fdecd2; color: #a35b00; }
    .pastilla-pasaporte.vencido { background: #fbe2e0; color: #b23327; }
    .pastilla-pasaporte.sin-dato { background: #f0f0f0; color: #999; }

    .celda-acciones {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-icono {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      background-color: #eef6f6;
      color: #02535a;
    }
    .btn-icono:hover { background-color: #02535a; color: white; }
    .btn-icono.eliminar:hover { background-color: #c0392b; color: white; }

    .vacio { text-align: center; color: #999; padding: 30px; }

    #modal, #modalReservas {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    #modalContent, #modalReservasContent {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    #modalReservasContent { max-width: 640px; }
    #modalContent h3, #modalReservasContent h3 { color: #02535a; margin-top: 0; }
    #modalContent label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-top: 12px;
      margin-bottom: 4px;
      color: #02535a;
    }
    #modalContent input {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    #modalContent .botones, #modalReservasContent .botones {
      margin-top: 20px;
      text-align: right;
    }
    #modalContent .botones button, #modalReservasContent .botones button {
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }
    .btn-guardar-modal { background: #02535a; color: white; }
    .btn-cancelar-modal { background: #ccc; color: #333; }
    .tabla-reservas-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 2px;
    }
    .tarjeta-reserva {
      border: 1px solid #dde8e8;
      border-radius: 10px;
      padding: 14px 16px;
      background: #fbfdfd;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .tarjeta-reserva:hover {
      border-color: #5f9296;
      box-shadow: 0 2px 10px rgba(2,83,90,0.08);
    }
    .tarjeta-reserva-datos {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 26px;
      font-size: 13.5px;
      color: #444;
    }
    .tarjeta-reserva-dato strong {
      color: #5f9296;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 11px;
      display: block;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .tarjeta-reserva-codigo {
      color: #02535a;
      font-weight: bold;
      text-decoration: none;
    }
    .tarjeta-reserva-codigo:hover {
      text-decoration: underline;
      color: #036a6d;
    }
    .tarjeta-reserva-vacio {
      text-align: center;
      color: #999;
      padding: 24px;
    }
  </style>
</head>
<body>

  <main id="contenidoPrincipal">

  <h2>🧑‍💼 Gestión de Clientes</h2>
  <p class="subtitulo">Titulares de reserva, con fecha de nacimiento y vencimiento de pasaporte — para avisos y campañas futuras.</p>

  <div class="tabla-container">
    <div class="acciones-superiores">
      <button id="crearClienteBtn" class="btn-agregar" onclick="mostrarModal()">➕ Crear Cliente</button>
      <input type="search" id="buscador" placeholder="🔍 Buscar por nombre, teléfono, correo o ID de reserva...">
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Contacto</th>
          <th>Nacionalidad</th>
          <th>Pasaporte</th>
          <th>F. Nacimiento</th>
          <th>Vence Pasaporte</th>
          <th style="text-align:center;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaClientes"></tbody>
    </table>
    <div id="avisoVacio" class="vacio" style="display:none;">No hay clientes que coincidan con la búsqueda.</div>
  </div>

  </main>

  <div id="modal">
    <div id="modalContent">
      <h3>Nuevo Cliente</h3>
      <label>Nombre completo</label>
      <input type="text" id="nuevoNombre">
      <label>Teléfono</label>
      <input type="text" id="nuevoTelefono">
      <label>Correo electrónico</label>
      <input type="email" id="nuevoCorreo">
      <label>Nacionalidad</label>
      <input type="text" id="nuevaNacionalidad">
      <label>Número de pasaporte</label>
      <input type="text" id="nuevoPasaporte">
      <label>Fecha de nacimiento</label>
      <input type="date" id="nuevaFechaNacimiento">
      <label>Vencimiento del pasaporte</label>
      <input type="date" id="nuevoVencimientoPasaporte">
      <div class="botones">
        <button class="btn-cancelar-modal" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-guardar-modal" onclick="guardarNuevoCliente()">Guardar</button>
      </div>
    </div>
  </div>

  <div id="modalReservas">
    <div id="modalReservasContent">
      <h3>Reservas del Cliente</h3>
      <div class="tabla-reservas-container" id="bodyReservas"></div>
      <div class="botones">
        <button class="btn-cancelar-modal" onclick="cerrarModalReservas()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // FIX: firebaseConfig estaba incompleto (le faltaban storageBucket,
    // messagingSenderId y appId) y tenía la misma apiKey mal escrita que ya
    // encontramos en otros archivos — se corrige aquí para que quede igual a
    // la configuración real usada en el resto del sistema.
    const firebaseConfig = {
      apiKey: "AIzaSyDUEZgkrW-3HbZu2BLej4v0mbDHZf2vRo8",
      authDomain: "tours-460717.firebaseapp.com",
      projectId: "tours-460717",
      storageBucket: "tours-460717.firebasestorage.app",
      messagingSenderId: "1000749333444",
      appId: "1:1000749333444:web:73437891b59a96b6a4c291"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const tabla = document.getElementById("tablaClientes");
    const buscador = document.getElementById("buscador");
    let clientes = [];
    let reservas = [];
    let clienteEnEdicion = null;

    function formatearFechaVisible(str) {
      if (!str) return '-';
      const fecha = new Date(str + "T00:00:00");
      if (isNaN(fecha.getTime())) return str;
      const dia = String(fecha.getDate()).padStart(2, '0');
      const mes = String(fecha.getMonth() + 1).padStart(2, '0');
      return `${dia}/${mes}/${fecha.getFullYear()}`;
    }

    // Pastilla de vencimiento de pasaporte: vencido / vence pronto (dentro
    // de 6 meses, el mismo plazo que ya se usa en las políticas de viaje) /
    // vigente / sin dato.
    function pastillaPasaporte(str) {
      if (!str) return `<span class="pastilla-pasaporte sin-dato">Sin dato</span>`;
      const vencimiento = new Date(str + "T00:00:00");
      if (isNaN(vencimiento.getTime())) return `<span class="pastilla-pasaporte sin-dato">${str}</span>`;

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const en6Meses = new Date(hoy);
      en6Meses.setMonth(en6Meses.getMonth() + 6);

      const texto = formatearFechaVisible(str);
      if (vencimiento < hoy) return `<span class="pastilla-pasaporte vencido">⚠️ ${texto}</span>`;
      if (vencimiento <= en6Meses) return `<span class="pastilla-pasaporte pronto">${texto}</span>`;
      return `<span class="pastilla-pasaporte ok">${texto}</span>`;
    }

    function mostrarClientes(filtrados) {
      tabla.innerHTML = "";

      if (filtrados.length === 0) {
        document.getElementById("avisoVacio").style.display = "block";
        return;
      }
      document.getElementById("avisoVacio").style.display = "none";

      filtrados.forEach(cli => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="celda-nombre">${cli.nombre}</td>
          <td class="celda-contacto">${cli.telefono}<small>${cli.correo || ''}</small></td>
          <td>${cli.nacionalidad || '-'}</td>
          <td>${cli.pasaporte || '-'}</td>
          <td>${formatearFechaVisible(cli.fechaNacimiento)}</td>
          <td>${pastillaPasaporte(cli.vencimientoPasaporte)}</td>
          <td>
            <div class="celda-acciones">
              <button class="btn-icono" title="Reservas" onclick="abrirModalReservas('${cli.telefono}')">🔍</button>
              <button class="btn-icono" title="Editar" onclick="editarCliente('${cli.telefono}')">✏️</button>
              <button class="btn-icono eliminar" title="Eliminar" onclick="eliminarCliente('${cli.telefono}')">🗑️</button>
            </div>
          </td>
        `;
        tabla.appendChild(row);
      });
    }

    function editarCliente(telefono) {
      const cliente = clientes.find(c => c.telefono === telefono);
      if (cliente) {
        clienteEnEdicion = telefono;
        document.getElementById("nuevoNombre").value = cliente.nombre;
        document.getElementById("nuevoTelefono").value = cliente.telefono;
        document.getElementById("nuevoCorreo").value = cliente.correo || '';
        document.getElementById("nuevaNacionalidad").value = cliente.nacionalidad || '';
        document.getElementById("nuevoPasaporte").value = cliente.pasaporte || '';
        document.getElementById("nuevaFechaNacimiento").value = cliente.fechaNacimiento || '';
        document.getElementById("nuevoVencimientoPasaporte").value = cliente.vencimientoPasaporte || '';
        mostrarModal();
      }
    }

    function eliminarCliente(telefono) {
      if (confirm("¿Estás seguro de eliminar este cliente?")) {
        db.collection("clientes").doc(telefono).delete().then(() => {
          clientes = clientes.filter(c => c.telefono !== telefono);
          mostrarClientes(clientes);
        }).catch(err => alert("Error al eliminar: " + err));
      }
    }

    function filtrarClientes() {
      const texto = buscador.value.toLowerCase();
      const filtrados = clientes.filter(c =>
        c.nombre.toLowerCase().includes(texto) ||
        c.telefono.toLowerCase().includes(texto) ||
        (c.correo || '').toLowerCase().includes(texto)
      );

      if (texto.startsWith("ed-")) {
        const clienteRelacionado = reservas.find(r => r.codigo.toLowerCase() === texto);
        if (clienteRelacionado) {
          const cliente = clientes.find(c => c.telefono === clienteRelacionado.telefonoCliente);
          if (cliente) return mostrarClientes([cliente]);
        }
      }

      mostrarClientes(filtrados);
    }

    function abrirModalReservas(telefono) {
      const body = document.getElementById("bodyReservas");
      body.innerHTML = "";
      const reservasCliente = reservas.filter(r => r.telefonoCliente === telefono);

      if (reservasCliente.length === 0) {
        body.innerHTML = `<div class="tarjeta-reserva-vacio">Este cliente todavía no tiene reservas.</div>`;
      } else {
        reservasCliente.forEach(r => {
          const cantidadPersonas = r.cantidadPersonas || (1 + (Array.isArray(r.pasajeros) ? r.pasajeros.length : 0));
          const tarjeta = document.createElement("div");
          tarjeta.className = "tarjeta-reserva";
          tarjeta.innerHTML = `
            <div class="tarjeta-reserva-datos">
              <div class="tarjeta-reserva-dato"><strong>Código</strong><a class="tarjeta-reserva-codigo" href="detalle_reserva.html?codigo=${r.codigo}" target="_blank">${r.codigo}</a></div>
              <div class="tarjeta-reserva-dato"><strong>Destino</strong>${r.nombreDestino || r.destino || '-'}</div>
              <div class="tarjeta-reserva-dato"><strong>Fecha Viaje</strong>${formatearFechaVisible(r.fechaReserva)}</div>
              <div class="tarjeta-reserva-dato"><strong>Personas</strong>${cantidadPersonas}</div>
            </div>
          `;
          body.appendChild(tarjeta);
        });
      }

      document.getElementById("modalReservas").style.display = "flex";
    }

    function cerrarModalReservas() {
      document.getElementById("modalReservas").style.display = "none";
    }

    function mostrarModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function cerrarModal() {
      document.getElementById("modal").style.display = "none";
      clienteEnEdicion = null;
      ["nuevoNombre","nuevoTelefono","nuevoCorreo","nuevaNacionalidad","nuevoPasaporte","nuevaFechaNacimiento","nuevoVencimientoPasaporte"]
        .forEach(id => document.getElementById(id).value = "");
    }

    function guardarNuevoCliente() {
      const nombre = document.getElementById("nuevoNombre").value.trim();
      const telefono = document.getElementById("nuevoTelefono").value.trim();
      const correo = document.getElementById("nuevoCorreo").value.trim();
      const nacionalidad = document.getElementById("nuevaNacionalidad").value.trim();
      const pasaporte = document.getElementById("nuevoPasaporte").value.trim();
      const fechaNacimiento = document.getElementById("nuevaFechaNacimiento").value;
      const vencimientoPasaporte = document.getElementById("nuevoVencimientoPasaporte").value;

      if (!nombre || !telefono || !correo) {
        alert("Por favor completa nombre, teléfono y correo — son obligatorios.");
        return;
      }

      const existente = clientes.find(c => c.telefono === telefono);

      const nuevo = {
        nombre,
        telefono,
        correo,
        nacionalidad,
        pasaporte,
        fechaNacimiento,
        vencimientoPasaporte,
        fechaRegistro: existente?.fechaRegistro || new Date().toISOString()
      };

      db.collection("clientes").doc(telefono).set(nuevo, { merge: true }).then(() => {
        const index = clientes.findIndex(c => c.telefono === telefono);
        if (index !== -1) clientes[index] = nuevo;
        else clientes.push(nuevo);
        mostrarClientes(clientes);
        cerrarModal();
      }).catch(err => {
        console.error("Error al guardar cliente:", err);
        alert("❌ Hubo un error al guardar.");
      });
    }

    buscador.addEventListener("input", filtrarClientes);

    Promise.all([
      db.collection("clientes").get(),
      db.collection("reservas").get()
    ]).then(([clientesSnap, reservasSnap]) => {
      clientes = clientesSnap.docs.map(doc => doc.data());
      reservas = reservasSnap.docs.map(doc => ({ ...doc.data(), codigo: doc.id }));
      mostrarClientes(clientes);
    });
  </script>
  <script src="topbar.js"></script>
  <script src="sidebar.js"></script>
  <!-- Verificación real de sesión (Firebase Authentication). -->
  <script src="auth-guard.js"></script>
</body>
</html>
