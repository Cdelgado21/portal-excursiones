<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Catálogo de Tours</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="topbar.css">
  <style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f7f7;
  padding: 0;
  margin: 0;
  font-size: 16px;
}

h2 {
  text-align: center;
  font-size: 24px;
  margin-top: 20px;
  margin-bottom: 6px;
  color: #02535a;
}

.subtitulo-catalogo {
  text-align: center;
  color: #5f9296;
  font-size: 0.9rem;
  margin-bottom: 25px;
}

.tabla-container {
  max-width: 100%;
  overflow-x: auto;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 2px 14px rgba(2,83,90,0.08);
}

.acciones {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.acciones-izquierda {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.btn-agregar, .btn-descarga {
  font-size: 15px;
  padding: 10px 20px;
  border-radius: 8px;
  background-color: #02535a;
  color: white;
  border: none;
  cursor: pointer;
}

.btn-agregar:hover,
.btn-descarga:hover {
  background-color: #036a6d;
}

/* Barra de búsqueda y filtro por experiencia */
.barra-filtros {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.barra-filtros input[type="search"] {
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid #cfe3e4;
  font-size: 14px;
  min-width: 200px;
}
.barra-filtros select {
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid #cfe3e4;
  font-size: 14px;
  background: white;
  color: #02535a;
  font-weight: bold;
}

table {
  width: 100%;
  min-width: 700px;
  border-collapse: separate;
  border-spacing: 0;
}

th {
  background-color: #02535a;
  color: white;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 14px 16px;
  text-align: left;
}
th:first-child { border-top-left-radius: 10px; }
th:last-child { border-top-right-radius: 10px; text-align: center; }

td {
  padding: 14px 16px;
  font-size: 15px;
  vertical-align: middle;
  border-bottom: 1px solid #eef3f3;
}

tbody tr:hover { background-color: #f7fbfb; }
tbody tr:last-child td { border-bottom: none; }

.celda-destino {
  font-weight: bold;
  color: #02535a;
  white-space: nowrap;
}

/* Pastilla de "Experiencia" — un color distinto por variante, para
   distinguirlas de un vistazo (colores ya usados en el resto del sistema,
   nada inventado). */
.pastilla-experiencia {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: bold;
  color: white;
}
.pastilla-experiencia.grupal   { background-color: #02535a; }
.pastilla-experiencia.flash    { background-color: #ffb703; color: #4a3200; }
.pastilla-experiencia.esencial { background-color: #5f9296; }
.pastilla-experiencia.confort  { background-color: #f49859; }

/* Estado como pastilla-botón (activo/inactivo), con un punto indicador. */
.btn-estado {
  padding: 7px 16px 7px 12px;
  border: none;
  border-radius: 999px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  color: white;
  background-color: #28a745;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-estado::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: white;
  display: inline-block;
}
.btn-estado.inactivo { background-color: #9aa3a3; }
.btn-estado:hover { transform: scale(1.05); background-color: #218838; }
.btn-estado.inactivo:hover { background-color: #838d8d; }

.celda-acciones {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.btn-icono {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
.btn-icono.editar { background-color: #fde9d9; color: #c15d1e; }
.btn-icono.editar:hover { background-color: #f49859; color: white; }
.btn-icono.eliminar { background-color: #fbe2e0; color: #b23327; }
.btn-icono.eliminar:hover { background-color: #c0392b; color: white; }

.btn-variante-nueva {
  background-color: transparent;
  color: #02535a;
  border: 1.5px dashed #9fc3c4;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  margin-left: 8px;
}
.btn-variante-nueva:hover { background-color: #f0f7f7; border-color: #02535a; }

@media (max-width: 768px) {
  table {
    font-size: 14px;
  }
}
</style>
</head>
<body>

  <main id="contenidoPrincipal">

  <h2>Catálogo de Tours</h2>
  <p class="subtitulo-catalogo">Organizado por destino y experiencia — Grupal, Flash, Esencial o Confort.</p>

  <div class="tabla-container">
    <div class="acciones">
      <div class="acciones-izquierda">
        <button class="btn-agregar" onclick="window.location.href='detalle_tours.html'">+ Nuevo Tour</button>
        <button class="btn-descarga" onclick="exportarTabla()">📄 Exportar PDF</button>
        <button class="btn-descarga" onclick="descargarCSV()">📥 Exportar CSV</button>
      </div>
      <div class="barra-filtros">
        <input type="search" id="buscadorDestino" placeholder="🔍 Buscar destino..." oninput="renderizarTabla()">
        <select id="filtroExperiencia" onchange="renderizarTabla()">
          <option value="">Toda experiencia</option>
          <option value="Grupal">Grupal</option>
          <option value="Flash">Flash</option>
          <option value="Esencial">Esencial</option>
          <option value="Confort">Confort</option>
        </select>
      </div>
    </div>
    <table id="tablaTours">
     <thead>
  <tr>
    <th>Destino</th>
    <th>Experiencia</th>
    <th>Estado</th>
    <th style="text-align:center;">Acciones</th>
  </tr>
</thead>
      <tbody id="tabla-body"><tr><td colspan="4">Cargando tours...</td></tr></tbody>
    </table>
  </div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUEZgkrW-3HbZu2BLej4v0mbDHZf2vRo8",
      authDomain: "tours-460717.firebaseapp.com",
      projectId: "tours-460717",
      storageBucket: "tours-460717.firebasestorage.app",
      messagingSenderId: "1000749333444",
      appId: "1:1000749333444:web:73437891b59a96b6a4c291"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let tourActualId = null;

    function agregarHotel(nombre = "", info = "") {
  const container = document.getElementById("hotelesContainer");
  const div = document.createElement("div");
  div.className = "hotel-entry";
  div.innerHTML = `
    <input placeholder="Nombre del hotel" class="hotel-nombre" type="text" value="${nombre}" />
    <textarea placeholder="Información del hotel" class="hotel-info">${info}</textarea>
  `;
  container.appendChild(div);
}

    // Orden lógico de las variantes dentro de cada destino — primero
    // Grupal (si existe), luego Flash, Esencial, Confort.
    const ORDEN_VARIANTE = { "Grupal": 0, "Flash": 1, "Esencial": 2, "Confort": 3 };

    function etiquetaVariante(t) {
      return t.tipoSalida === "Individual" ? (t.nivel || "Individual") : "Grupal";
    }

    function claseVariante(etiqueta) {
      const mapa = { "Grupal": "grupal", "Flash": "flash", "Esencial": "esencial", "Confort": "confort" };
      return mapa[etiqueta] || "grupal";
    }

    let todosLosTours = [];

    function cargarTours() {
      db.collection("tours").get().then(snapshot => {
        todosLosTours = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizarTabla();
      }).catch(e => {
        console.error("Error al cargar los tours:", e);
        document.getElementById("tabla-body").innerHTML = `<tr><td colspan="4" style="text-align:center; color:#a35b00;">⚠️ No se pudieron cargar los tours.</td></tr>`;
      });
    }

    // Agrupa ignorando tildes y mayúsculas/minúsculas — así "Medellin",
    // "Medellín" y "MEDELLÍN" se reconocen como el mismo destino para efectos
    // de agrupar y ordenar, aunque el texto guardado en cada tour sea
    // distinto. El texto real de cada tour NO se toca ni se corrige solo.
    function normalizarDestino(texto) {
      return (texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function renderizarTabla() {
      const tbody = document.getElementById("tabla-body");
      const texto = document.getElementById("buscadorDestino").value.toLowerCase();
      const experienciaFiltro = document.getElementById("filtroExperiencia").value;

      let filtrados = todosLosTours.filter(t => {
        const destino = (t.nombre || "").toLowerCase();
        if (texto && !destino.includes(texto)) return false;
        if (experienciaFiltro && etiquetaVariante(t) !== experienciaFiltro) return false;
        return true;
      });

      // Ordena por destino (ignorando tildes/mayúsculas) y, dentro de cada
      // destino, por el orden lógico de experiencia — así las variantes del
      // mismo lugar quedan juntas aunque estén escritas un poco distinto.
      filtrados.sort((a, b) => {
        const destinoCompare = normalizarDestino(a.nombre).localeCompare(normalizarDestino(b.nombre));
        if (destinoCompare !== 0) return destinoCompare;
        return (ORDEN_VARIANTE[etiquetaVariante(a)] ?? 9) - (ORDEN_VARIANTE[etiquetaVariante(b)] ?? 9);
      });

      tbody.innerHTML = "";

      if (filtrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999; padding:30px;">Ningún tour coincide con la búsqueda.</td></tr>`;
        return;
      }

      let grupoAnterior = null;
      let textoAnteriorEnGrupo = null;
      filtrados.forEach(t => {
        const etiqueta = etiquetaVariante(t);
        const grupoActual = normalizarDestino(t.nombre);
        const esNuevoDestino = grupoActual !== grupoAnterior;

        // Si sigue en el mismo grupo pero el texto exacto cambió (tilde,
        // mayúscula, espacio de más...), se marca con un aviso — para que
        // Cristopher lo vea y lo corrija cuando quiera, sin que el sistema
        // lo cambie por su cuenta.
        const escrituraDistinta = !esNuevoDestino && t.nombre !== textoAnteriorEnGrupo;

        grupoAnterior = grupoActual;
        textoAnteriorEnGrupo = t.nombre;

        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td class="celda-destino">
            📍 ${t.nombre || '-'}
            ${esNuevoDestino ? `<a class="btn-variante-nueva" href="detalle_tours.html?nombre=${encodeURIComponent(t.nombre || '')}">➕ variante</a>` : ''}
            ${escrituraDistinta ? `<span title="Este tour está escrito distinto al resto del grupo (revisa tildes, mayúsculas o espacios) — corrígelo editando el tour." style="margin-left:6px; cursor:help;">⚠️</span>` : ''}
          </td>
          <td><span class="pastilla-experiencia ${claseVariante(etiqueta)}">${etiqueta}</span></td>
          <td>
            <button class="btn-estado ${t.estado === 'ACTIVO' ? '' : 'inactivo'}"
              onclick="toggleEstado('${t.id}', '${t.estado}')">${t.estado === 'ACTIVO' ? 'Activo' : 'Inactivo'}</button>
          </td>
          <td>
            <div class="celda-acciones">
              <button class="btn-icono editar" title="Editar" onclick="window.location.href='detalle_tours.html?id=${t.id}'">✏️</button>
              <button class="btn-icono eliminar" title="Eliminar" onclick="eliminarTour('${t.id}')">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(fila);
      });
    }
    
    function eliminarTour(id) {
      if (confirm("¿Eliminar este tour?")) {
        db.collection("tours").doc(id).delete().then(() => cargarTours());
      }
    }

    function toggleEstado(id, estado) {
      const nuevo = estado === "ACTIVO" ? "INACTIVO" : "ACTIVO";
      db.collection("tours").doc(id).update({ estado: nuevo }).then(() => cargarTours());
    }

    function exportarTabla() {
      html2canvas(document.querySelector("#tablaTours")).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const pdf = new jspdf.jsPDF();
        pdf.addImage(imgData, "PNG", 10, 10);
        pdf.save("tours.pdf");
      });
    }

    function descargarCSV() {
      const filas = document.querySelectorAll("#tablaTours tr");
      const csv = Array.from(filas).map(row =>
        Array.from(row.cells).map(cell => cell.textContent.trim()).join(",")
      ).join("\n");
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "tours.csv";
      a.click();
    }
function abrirOpcionales(tourId) {
  window.open(`opcionales.html?tourId=${tourId}`, '_blank');
}

    // NUEVO: espera a que Firebase Auth confirme la sesión antes de
    // consultar Firestore — mismo fix aplicado en dashboard.html, evita el
    // error intermitente "Missing or insufficient permissions" cuando la
    // consulta salía antes de que Auth terminara de restaurar la sesión.
    firebase.auth().onAuthStateChanged(function (user) {
      if (!user) return; // auth-guard.js se encarga de redirigir a login
      cargarTours();
    });
  </script>
  <!-- Barra superior compartida — va antes del menú lateral compartido. -->
  <script src="topbar.js"></script>
  <!-- Menú lateral compartido (antes cada página tenía su propio sidebar
       copiado a mano, sin sincronizar). -->
  <script src="sidebar.js"></script>
  <!-- Verificación real de sesión (Firebase Authentication), en vez de
       confiar solo en lo que dijera localStorage. -->
  <script src="auth-guard.js"></script>
</body>
</html>
